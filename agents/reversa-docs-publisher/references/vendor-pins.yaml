# vendor-pins.yaml
#
# Official matrix of third-party libraries used by pages generated by the
# Reversa Docs Team. The Publisher consumes this file in the "Bundle vendor
# local" step to download each lib into assets/vendor/ before rendering any
# page, ensuring the mini-site works 100% offline and via file://.
#
# Rules:
#  - "version" is the canonical pin. Do not change major/minor without reviewing
#    all skills that depend on the combination (Code City, force-directed, dashboards).
#  - "format" can be "iife" (compatible with <script src>) or "esm" (needs
#    importmap + <script type=module>). Today everything is fixed in IIFE so that
#    double-click on Windows works without bundler dependency.
#  - "compatible_with" declares dependencies between libs. Use to detect
#    invalid combinations (e.g., OrbitControls from r158 does not run as IIFE).
#  - "files[].url" is the first attempt. If it fails (HEAD != 200), the
#    Publisher walks "fallbacks" in order. Always prefer at least 2
#    CDNs per file: unpkg + jsdelivr cover 99% of observed failures.
#  - "local" is the relative path inside .reversa/documentation/. The
#    HTML templates reference exactly this path via <script src>.

schema_version: 1

libs:

  three:
    version: "0.147.0"
    format: iife
    notes: >
      Pinned at 0.147 because it is the last release that still publishes OrbitControls
      in IIFE format (examples/js/controls/). From 0.150 onward only the
      ES module version exists in examples/jsm/, which requires importmap. Migrating to 0.158+
      with importmap is future work and is documented in Error 3 of the field
      report (specs/erros_em_docs.md).
    files:
      - url: "https://unpkg.com/three@0.147.0/build/three.min.js"
        local: "assets/vendor/three.min.js"
        fallbacks:
          - "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
          - "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"

  orbit_controls:
    version: "0.147.0"
    format: iife
    compatible_with: ["three@0.147.0"]
    notes: >
      IIFE version of OrbitControls, discontinued from three@0.150 onward.
      Kept via raw.githubusercontent (more stable than CDN mirrors for
      files that are not part of the official npm bundle).
    files:
      - url: "https://raw.githubusercontent.com/mrdoob/three.js/r147/examples/js/controls/OrbitControls.js"
        local: "assets/vendor/OrbitControls.js"
        fallbacks:
          - "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r147/examples/js/controls/OrbitControls.js"

  d3:
    version: "7.8.5"
    format: iife
    files:
      - url: "https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"
