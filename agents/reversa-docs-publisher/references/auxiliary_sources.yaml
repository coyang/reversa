# Directories scanned by the Publisher in auto-discovery of auxiliary HTMLs.
# HTMLs found must have <meta name="reversa-category" content="..."> to be indexed.

scan_roots:
  - path: "_reversa_sdd/"
    description: "SDD specs and outputs from Discovery and Migration agents."
  - path: ".reversa/"
    description: "Cross-cutting core artifacts."
    exclude:
      - ".reversa/documentation/"
      - ".reversa/_config/"
      - ".reversa/context/"

categories:
  - id: review
    label: "Code Reviews"
    description: "Annotated PRs generated by reversa-reviewer and similar."
  - id: design-system
    label: "Design System"
    description: "Living Design System from reversa-design-system."
  - id: diagram
    label: "Diagrams"
    description: "Annotated Flowcharts and additional architectures."

limits:
  max_depth: 6
  timeout_seconds: 10
