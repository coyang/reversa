# MkDocs configuration generated by Reversa MkDocs Generator
# Edit this file to customize theme, nav, plugins, or extensions.
# Regenerate with: /reversa-mkdocs

# ── Site metadata ──────────────────────────────────────────
site_name: "{{PROJECT_NAME}} — System Documentation"
site_description: "Auto-generated documentation from Reversa specification reverse engineering"
site_author: "Reversa"
copyright: 'Generated by <a href="https://github.com/sandeco/reversa">Reversa</a>'

# ── Repository (optional) ─────────────────────────────────
# Uncomment and configure if you want edit/view on GitHub links:
# repo_url: https://github.com/your-org/your-project
# repo_name: your-org/your-project
# edit_uri: edit/main/_reversa_sdd/

# ── Theme (mkdocs-material) ────────────────────────────────
theme:
  name: material
  language: "{{MKDOCS_LANGUAGE}}"
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide
  icon:
    logo: material/magnify
    repo: fontawesome/brands/github

# ── Markdown extensions ────────────────────────────────────
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3

# ── Plugins ────────────────────────────────────────────────
plugins:
  - search
  # PDF export (enable with: ENABLE_PDF_EXPORT=1 mkdocs build)
  - pdf-export:
      verbose: true
      media_type: print
      enabled_if_env: ENABLE_PDF_EXPORT
      combined: true
      combined_output_path: "../reversa-documentation.pdf"

# ── Extra CSS / JS ─────────────────────────────────────────
extra_css:
  - css/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra:
  generator: false

# ── Docs and site directories ─────────────────────────────
# mkdocs.yml is placed at the project root by the agent.
# docs_dir = "." means we serve both docs/index.md and _reversa_sdd/ content.
# agent sets site_dir to .reversa/documentation/site
docs_dir: .
site_dir: .reversa/documentation/site

# ── Navigation ────────────────────────────────────────────
# WARNING: This section is auto-generated by the reversa-mkdocs agent.
# All paths are relative to project root (docs_dir = ".").
# docs/index.md = entry page
# _reversa_sdd/* = all content
nav:
  - Home: docs/index.md
